<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Stewardship Sync</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0d0d0d; color: #f0ede4; margin: 0; padding: 14px; width: 320px; }
    h1 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
    .sub { font-size: 11px; color: rgba(240,237,228,0.55); margin-bottom: 14px; }
    .status { font-size: 12px; padding: 10px 12px; border-radius: 4px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 12px; line-height: 1.5; }
    .status.ok { border-color: rgba(107,203,119,0.3); background: rgba(107,203,119,0.08); color: #6BCB77; }
    .status.err { border-color: rgba(231,76,60,0.3); background: rgba(231,76,60,0.08); color: #E74C3C; }
    .status.warn { border-color: rgba(242,201,76,0.3); background: rgba(242,201,76,0.08); color: #F2C94C; }
    button { width: 100%; padding: 10px 12px; background: rgba(224,122,95,0.15); border: 1px solid rgba(224,122,95,0.5); color: #E07A5F; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: transparent; border-color: rgba(255,255,255,0.1); color: rgba(240,237,228,0.75); margin-top: 8px; }
    .footer { font-size: 10px; color: rgba(240,237,228,0.4); margin-top: 14px; text-align: center; }
    a { color: #4ECDC4; text-decoration: none; }
    .meta { font-size: 11px; color: rgba(240,237,228,0.55); margin-top: 8px; max-height: 240px; overflow-y: auto; line-height: 1.5; }
    .meta strong { color: #f0ede4; }
  </style>
</head>
<body>
  <h1>Stewardship Sync</h1>
  <div class="sub">CREXi + LoopNet → CRM</div>
  <div id="status" class="status">Checking…</div>
  <button id="sync">Sync this listing</button>
  <button id="settings" class="secondary">Settings</button>
  <div id="meta" class="meta"></div>

  <div id="watcher-panel" style="margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06);">
    <div style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(240,237,228,0.55); margin-bottom: 6px;">
      Leads watcher
    </div>
    <div id="watcher-status" style="font-size: 11px; color: rgba(240,237,228,0.75); line-height: 1.45;">Checking…</div>
    <button id="run-watcher-now" class="secondary" style="margin-top: 8px;">Run leads watcher now</button>
  </div>

  <div class="footer">v0.3.2 · <a href="#" id="open-options">Configure API key</a></div>
  <script src="popup.js"></script>
</body>
</html>
