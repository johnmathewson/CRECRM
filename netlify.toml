[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Netlify scheduled functions live here. Schedule is set via each
  # function's exported `config.schedule` (see netlify/functions/poll-gmail.mts).
  directory = "netlify/functions"

  # Bundle the agents/ directory (markdown playbooks) with every
  # function so readFileSync resolves at runtime.
  included_files = ["agents/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
