name: Poll Gmail Inbox

on:
  # Manual trigger only — primary scheduling lives in Supabase pg_cron now.
  # This workflow is kept as a backup / debugging trigger you can fire from
  # the GitHub UI if pg_cron ever has issues.
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Gmail polling cron
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://stewardship-crm.netlify.app/api/cron/poll-gmail")

          echo "Status: $response"
          # Truncate body in logs to avoid leaking history IDs
          head -c 500 /tmp/body || true
          echo ""

          if [ "$response" != "200" ]; then
            echo "::error::Cron failed with status $response"
            exit 1
          fi
